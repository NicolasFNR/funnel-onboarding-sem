<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Funnel Onboarding México</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

:root{
    --bg:#f6f8fb;
    --card:#ffffff;
    --text:#1e293b;
    --muted:#64748b;
    --border:#e2e8f0;

    --digital:#00b37e;
    --presencial:#2563eb;

    --danger:#ef4444;

    --shadow:0 10px 30px rgba(0,0,0,.08);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:var(--bg);
    font-family:'Inter',sans-serif;
    color:var(--text);
}

.container{
    max-width:1500px;
    margin:auto;
    padding:24px;
}

/* HEADER */

.hero{

    background:
    linear-gradient(
    135deg,
    #0f172a,
    #1e293b);

    color:white;

    border-radius:24px;

    padding:32px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    box-shadow:var(--shadow);
}

.hero h1{
    font-size:40px;
    margin-bottom:5px;
}

.hero p{
    opacity:.75;
}

.week{

    background:rgba(255,255,255,.12);

    padding:18px 25px;

    border-radius:16px;

    text-align:center;
}

/* KPI */

.kpi-grid{

    margin-top:24px;

    display:grid;
    grid-template-columns:repeat(4,1fr);

    gap:20px;
}

.card{

    background:var(--card);

    border-radius:20px;

    padding:24px;

    box-shadow:var(--shadow);
}

.kpi-title{
    color:var(--muted);
    font-size:14px;
}

.kpi-value{
    font-size:40px;
    font-weight:800;
    margin-top:10px;
}

.kpi-change{

    margin-top:8px;

    color:var(--danger);

    font-size:14px;

    font-weight:600;
}

/* TABS */

.tabs{

    display:flex;

    gap:10px;

    margin-top:32px;
}

.tab{

    border:none;

    padding:14px 24px;

    border-radius:14px;

    cursor:pointer;

    background:white;

    font-weight:600;

    transition:.3s;
}

.tab.active{
    color:white;
    background:var(--digital);
}

/* SECTION */

.section-title{

    font-size:24px;

    margin:30px 0 18px;
}

/* DASHBOARD */

.dashboard{

    display:grid;

    grid-template-columns:1.5fr 1fr;

    gap:24px;
}

.panel{

    background:white;

    border-radius:24px;

    padding:24px;

    box-shadow:var(--shadow);
}

/* RATE */

.rate{

    font-size:72px;

    font-weight:800;
}

.label{
    color:var(--muted);
}

.progress{

    margin-top:20px;

    width:100%;

    height:14px;

    background:#e5e7eb;

    border-radius:999px;

    overflow:hidden;
}

.progress-fill{

    height:100%;
}

/* BARS */

.stage{

    margin-bottom:18px;
}

.stage-header{

    display:flex;

    justify-content:space-between;

    margin-bottom:6px;
}

.bar{

    height:12px;

    border-radius:999px;

    overflow:hidden;

    background:#e5e7eb;
}

.bar-fill{
    height:100%;
    background:#ef4444;
}

/* TABLE */

table{
    width:100%;
    border-collapse:collapse;
}

th{
    text-align:left;
    color:var(--muted);
}

th,td{
    padding:14px;
    border-bottom:1px solid var(--border);
}

tbody tr:hover{
    background:#f8fafc;
}

.hidden{
    display:none;
}

/* FOOTER */

.footer{

    margin-top:25px;

    color:var(--muted);

    text-align:center;
}

/* RESPONSIVE */

@media(max-width:1100px){

.dashboard{
grid-template-columns:1fr;
}

.kpi-grid{
grid-template-columns:repeat(2,1fr);
}

.hero{
flex-direction:column;
gap:20px;
align-items:flex-start;
}

}

@media(max-width:700px){

.kpi-grid{
grid-template-columns:1fr;
}

.hero h1{
font-size:30px;
}

.rate{
font-size:50px;
}

}

</style>

</head>
<body>

<div class="container">

    <!-- HEADER -->

    <div class="hero">

        <div>
            <h1>Funnel Onboarding México</h1>
            <p>Reporte Ejecutivo Semanal</p>
        </div>

        <div class="week">
            <div>Semana 43</div>
            <strong>19 Oct - 27 Oct 2026</strong>
        </div>

    </div>

    <!-- KPIs -->

    <div class="kpi-grid">

        <div class="card">
            <div class="kpi-title">Solicitudes Digital</div>
            <div class="kpi-value">7,857</div>
            <div class="kpi-change">▼ -17.9%</div>
        </div>

        <div class="card">
            <div class="kpi-title">Aprobados Digital</div>
            <div class="kpi-value">518</div>
            <div class="kpi-change">▼ -23.9%</div>
        </div>

        <div class="card">
            <div class="kpi-title">Solicitudes Presencial</div>
            <div class="kpi-value">37,775</div>
            <div class="kpi-change">▼ -26.3%</div>
        </div>

        <div class="card">
            <div class="kpi-title">Aprobados Presencial</div>
            <div class="kpi-value">5,911</div>
            <div class="kpi-change">▼ -29.6%</div>
        </div>

    </div>

    <!-- TABS -->

    <div class="tabs">

        <button class="tab active"

        </button>
