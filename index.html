<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Funnel Onboarding México</title>

<style>

:root{
    --digital:#0ea5a4;
    --presencial:#2563eb;
    --danger:#ef4444;
    --success:#22c55e;
    --bg:#f4f7fb;
    --card:#ffffff;
    --text:#111827;
    --secondary:#6b7280;
    --shadow:0 4px 20px rgba(0,0,0,.08);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI, sans-serif;
}

body{
    background:var(--bg);
}

.container{
    max-width:1400px;
    margin:auto;
    padding:25px;
}

/* HEADER */

.header{
    background:linear-gradient(135deg,#0f172a,#1e293b);
    color:white;
    padding:30px;
    border-radius:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.header h1{
    font-size:36px;
}

.header p{
    opacity:.8;
}

.week{
    background:rgba(255,255,255,.15);
    padding:15px 20px;
    border-radius:12px;
    text-align:center;
}

/* KPIS */

.kpis{
    margin-top:25px;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
}

.card{
    background:var(--card);
    box-shadow:var(--shadow);
    border-radius:16px;
    padding:25px;
}

.card h4{
    color:var(--secondary);
    margin-bottom:10px;
}

.value{
    font-size:36px;
    font-weight:700;
}

.change{
    color:var(--danger);
    margin-top:10px;
}

/* COMPARATIVO */

.section-title{
    margin:35px 0 20px;
    font-size:28px;
}

.compare{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.compare-card{
    background:white;
    box-shadow:var(--shadow);
    padding:25px;
    border-radius:18px;
}

.badge{
    display:inline-block;
    color:white;
    padding:8px 15px;
    border-radius:30px;
}

.digital{
    background:var(--digital);
}

.presencial{
    background:var(--presencial);
}

.rate{
    font-size:60px;
    font-weight:bold;
    margin:15px 0;
}

.progress{
    height:14px;
    background:#e5e7eb;
    border-radius:20px;
    overflow:hidden;
}

.progress-fill{
    height:100%;
}

/* TABS */

.tabs{
    display:flex;
    margin-top:30px;
    gap:10px;
}

.tab{
    border:none;
    background:white;
    padding:14px 25px;
    border-radius:12px;
    cursor:pointer;
    box-shadow:var(--shadow);
    font-weight:600;
}

.tab.active{
    background:#2563eb;
    color:white;
}

.tab-content{
    margin-top:20px;
}

.hidden{
    display:none;
}

/* PANELS */

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.panel{
    background:white;
    padding:25px;
    border-radius:16px;
    box-shadow:var(--shadow);
}

.panel h3{
    margin-bottom:20px;
}

.loss{
    margin-bottom:18px;
}

.loss-top{
    display:flex;
    justify-content:space-between;
    margin-bottom:6px;
}

.loss-bar{
    background:#e5e7eb;
    height:10px;
    border-radius:30px;
}

.loss-fill{
    background:var(--danger);
    height:100%;
    border-radius:30px;
}

/* TABLE */

table{
    width:100%;
    border-collapse:collapse;
    margin-top:25px;
    background:white;
    border-radius:16px;
    overflow:hidden;
    box-shadow:var(--shadow);
}

th,td{
    padding:15px;
    text-align:left;
}

th{
    background:#f8fafc;
}

tr{
    border-bottom:1px solid #ececec;
}

tr:hover{
    background:#f9fafb;
}

@media(max-width:1000px){

.kpis{
grid-template-columns:1fr 1fr;
}

.compare{
grid-template-columns:1fr;
}

.grid{
grid-template-columns:1fr;
}

}

@media(max-width:700px){

.kpis{
grid-template-columns:1fr;
}

.header{
flex-direction:column;
align-items:flex-start;
gap:20px;
}

.rate{
font-size:42px;
}

}

</style>
</head>
